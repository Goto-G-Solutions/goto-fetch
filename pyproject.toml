[project]
name = "api-explorer"
version = "0.1.0"
description = "Pull data from paginated JSON APIs, and shape it for any dataframe library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13.1",
    "narwhals>=2.27.1",
]

[project.optional-dependencies]
# HTML scraping (api_explorer.scrape)
scrape = ["parsel>=1.10.0"]
# The explorer notebook
explorer = ["marimo>=0.25.1"]

[dependency-groups]
# Everything the tests use: two dataframe libraries, so code meant to work on
# any frame is tried on more than one, and parsel for the scraping tests.
dev = [
    "pandas>=2.2",
    "parsel>=1.10.0",
    "polars>=1.33",
    "pytest>=8.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# marimo ends every notebook cell with a bare return; let it.
ignore = ["PLR1711"]
