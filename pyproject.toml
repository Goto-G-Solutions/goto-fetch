[project]
name = "goto-fetch"
version = "0.1.1"
description = "Pull data from paginated JSON APIs safely, fetch only what changed, and store it for analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dario Clarke" }]
keywords = ["api", "rest", "pagination", "json", "dataframe", "narwhals", "marimo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "narwhals>=2.27.1",
    "urllib3>=2.5",
]

[project.scripts]
# gtfetch explore opens the explorer; gtfetch docs prints a guide (goto_fetch.cli)
gtfetch = "goto_fetch.cli:main"

[project.urls]
Repository = "https://github.com/Goto-G-Solutions/goto-fetch"
Issues = "https://github.com/Goto-G-Solutions/goto-fetch/issues"
Changelog = "https://github.com/Goto-G-Solutions/goto-fetch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Faster JSON parsing, with the same results (see json_decoder)
fast = ["msgspec>=0.22"]
# HTML scraping (goto_fetch.scrape)
scrape = ["parsel>=1.10.0"]
# The explorer notebook
explorer = ["marimo>=0.25.1"]
# Sending requests with httpx2: HTTP/2, an httpx2.Client of your own (Httpx2Transport)
httpx2 = ["httpx2>=2.13.1"]
# Storing records and run state in DuckDB (DuckDBWarehouse)
duckdb = ["duckdb>=1.5"]
# A dataframe library for to_frame. pyarrow works too, by name, but has no
# extra: polars and pandas cover what people building frames want.
polars = ["polars>=1.33"]
pandas = ["pandas>=2.2"]

[dependency-groups]
# Everything the tests use: two dataframe libraries, so code meant to work on
# any frame is tried on more than one, plus every optional package an
# adapter supports, so each adapter is tested.
dev = [
    "duckdb>=1.5",
    "httpx2>=2.13.1",
    "hypothesis>=6.150",
    "marimo>=0.25.1",
    "msgspec>=0.22",
    "orjson>=3.11",
    "pandas>=2.2",
    "parsel>=1.10.0",
    "polars>=1.33",
    "pydantic>=2.11",
    "pyright>=1.1.400",
    "pytest>=8.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pyright]
# tests/test_protocols.py proves each piece fits its interface, so it is
# type checked too; the other tests are not.
include = ["src", "tests/test_protocols.py"]
# The explorer notebook is marimo's: marimo check --strict reads it.
exclude = ["src/goto_fetch/explorer/notebook.py"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# marimo formats the notebook on save, in a way ruff can't reproduce.
exclude = ["src/goto_fetch/explorer/notebook.py"]

[tool.ruff.lint]
# marimo ends every notebook cell with a bare return; let it.
ignore = ["PLR1711"]
