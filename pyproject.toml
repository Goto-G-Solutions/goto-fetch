[project]
name = "api-explorer"
version = "0.1.0"
description = "Pull data from paginated JSON APIs, and shape it for any dataframe library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dario Clarke" }]
keywords = ["api", "rest", "pagination", "json", "dataframe", "narwhals", "marimo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13.1",
    "narwhals>=2.27.1",
]

[project.urls]
Repository = "https://github.com/dario-j-c/api-explorer"
Issues = "https://github.com/dario-j-c/api-explorer/issues"
Changelog = "https://github.com/dario-j-c/api-explorer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Faster JSON parsing, with the same results (see json_decoder)
fast = ["msgspec>=0.22"]
# HTML scraping (api_explorer.scrape)
scrape = ["parsel>=1.10.0"]
# The explorer notebook
explorer = ["marimo>=0.25.1"]
# Storing records and run state in DuckDB (api_explorer.warehouse)
duckdb = ["duckdb>=1.5"]

[dependency-groups]
# Everything the tests use: two dataframe libraries, so code meant to work on
# any frame is tried on more than one, plus every optional package an
# adapter supports, so each adapter is tested.
dev = [
    "duckdb>=1.5",
    "hypothesis>=6.150",
    "msgspec>=0.22",
    "orjson>=3.11",
    "pandas>=2.2",
    "parsel>=1.10.0",
    "polars>=1.33",
    "pydantic>=2.11",
    "pyright>=1.1.400",
    "pytest>=8.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# marimo formats the notebooks on save, in a way ruff can't reproduce.
exclude = ["notebooks/*"]

[tool.ruff.lint]
# marimo ends every notebook cell with a bare return; let it.
ignore = ["PLR1711"]
