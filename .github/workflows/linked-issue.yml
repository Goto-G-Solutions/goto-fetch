name: Linked issue

# Every pull request must link the open issue it solves, such as
# "Closes #12". See CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find the linked issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(printf '%s' "$BODY" \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | head -n 1 | grep -Eo '[0-9]+' || true)
          if [ -z "$number" ]; then
            echo "::error::Link the issue this pull request solves, such as 'Closes #12'. Open one first if there isn't one."
            exit 1
          fi
          state=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)
          if [ "$state" != "OPEN" ]; then
            echo "::error::#$number isn't an open issue. Link the open issue this pull request solves."
            exit 1
          fi
          echo "Linked to issue #$number."
