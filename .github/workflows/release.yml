name: Release

# Publishes to PyPI when a version tag such as v0.1.0 is pushed. Uses
# trusted publishing, so no PyPI token is stored here; see "Releasing" in
# CONTRIBUTING.md for the one-time setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # No cache on the job that builds what is published: a poisoned
          # cache entry could reach the wheel.
          enable-cache: false
      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          fi
      # What CI checks on every pull request, again on the commit that is
      # published: a tag can be pushed on any commit, checked or not.
      - run: uv run pytest
      - run: uvx ruff check
      - run: uvx ruff format --check
      - run: uv run pyright
      - run: uvx --with pytest marimo check --strict src/goto_fetch/explorer/notebook.py
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
