name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}, with everything the tests use
    # The oldest and newest Python supported: behaviour can differ between
    # them (3.14 delays evaluating annotations, 3.11 doesn't).
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} pytest

  core:
    name: Tests, with only the core dependencies
    # Proves the core works without the optional extras. Tests that need an
    # extra skip themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --no-dev --with pytest pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check
      - run: uvx ruff format --check
      - run: uvx --with pytest marimo check --strict notebooks/explorer.py

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pyright

  notebook:
    name: Explorer notebook runs on Python 3.11
    # marimo check reads the notebook; this runs every cell, on the oldest
    # Python supported, and fails if any cell does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run --python 3.11 --with marimo --with-editable .
          marimo export html notebooks/explorer.py -o explorer.html
