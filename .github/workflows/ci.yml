name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}, with everything the tests use
    # Every Python the package is classified for. The ends catch most
    # differences (3.14 delays evaluating annotations, 3.11 doesn't); the
    # ones between catch a dependency without a wheel for that version.
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --python ${{ matrix.python }} pytest

  core:
    name: Tests, with only the core dependencies
    # Proves the core works without the optional extras. Tests that need an
    # extra skip themselves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --isolated --no-dev --with pytest pytest

  oldest:
    name: Tests on the oldest dependencies the package allows
    # The minimums in pyproject.toml are a promise; this keeps it true.
    # lowest-direct picks the lowest version each direct dependency allows,
    # so the minimums have one home. pytest gets a floor of its own, or it
    # would be resolved to a version too old to install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: >-
          uv run --isolated --no-dev --python 3.11 --resolution lowest-direct
          --with-editable . --with "pytest>=8.4" pytest

  package:
    name: The built package ships its guides
    # The guides are data files beside the code; a packaging change could
    # drop them without any test noticing. This installs the built wheel
    # alone and reads a guide and the skill from it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --wheel --out-dir dist
      - run: |
          cd /tmp
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl python -m goto_fetch.docs paging | head -1 | grep -qx "# Paging"
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl python -m goto_fetch.docs skill | grep -q "name: goto-fetch"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx ruff check
      - run: uvx ruff format --check
      - run: uvx zizmor .github/workflows
      - run: uvx --with pytest marimo check --strict notebooks/explorer.py

  types:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run pyright

  notebook:
    name: Explorer notebook runs on Python 3.11
    # marimo check reads the notebook; this runs every cell, on the oldest
    # Python supported, and fails if any cell does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep the token out of .git
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: >-
          uv run --python 3.11 --with marimo --with-editable .
          marimo export html notebooks/explorer.py -o explorer.html
